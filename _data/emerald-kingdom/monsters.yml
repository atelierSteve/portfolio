    dex: { val: 16, mod: "+3", save: "+5" }
    wis: { val: 12, mod: "+1", save: "+1" }
    con: { val: 12, mod: "+1", save: "+1" }
    cha: { val: 8, mod: "-1", save: "+1" }
  features:
    - name: "Flyby"
      desc: "The Monkey doesn't provoke opportunity attacks when it flies out of an enemy's reach."
  actions:
