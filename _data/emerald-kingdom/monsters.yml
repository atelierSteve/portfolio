      type: "Melee Weapon Attack"
      bonus: "+5"
      detail: "to hit, reach 5 ft., one target."
      hit: "5 (1d4 + 3) piercing damage."
    - name: "Claws"
      type: "Melee Weapon Attack"
      bonus: "5"
      detail: "to hit, reach 5 ft., one target."
      hit: "6 (1d6 + 3) slashing damage."
  meta_lines:
    - label: "Skills"
      text: "Acrobatics +5, Perception +3"
    - label: "Sense"
      text: "passive Perception 13"
    - label: "Languages"
      text: "understands Common but cannot speak"
    - label: "Challenge"
      text: "1/4 (50 XP)"

hammer-head:
  name: "Hammer-Head"
  epithet: "Medium monstrosity, unaligned"
  ac: "14"
  initiative: "-3"
  hp: "30 (4d8 + 12)"
  speed: "30 ft., climb 30 ft., fly 40 ft."
  stats:
    str: { val: 16, mod: "+3", save: "+5" }
    int: { val: 4, mod: "-3", save: "-3" }
    dex: { val: 10, mod: "+0", save: "+0" }
    wis: { val: 10, mod: "+0", save: "+0" }
    con: { val: 16, mod: "+3", save: "+5" }
    cha: { val: 5, mod: "-2", save: "-2" }
  features:
    - name: "Unyielding Neck"
      desc: "The Hammer-Head has advantage on saving throws against being knocked prone or moved against its will."
  actions:
    - name: "Headbutt"
      type: "Melee Weapon Attack"
      bonus: "+5"
      detail: "to hit, reach 5 ft., one target."
      hit: "8 (1d10 + 3) bludgeoning damage."
    - name: "Extend Neck"
      detail: "The Hammer-Head extends its neck up to 20 feet and makes a Headbutt attack. On a hit, the target must succeed on a DC 13 Strength saving throw or be pushed 10 feet."
  meta_lines:
    - label: "Resistances"
      text: "bludgeoning, piercing, and slashing from nonmagical attacks"
    - label: "Sense"
      text: "passive Perception 10"
    - label: "Languages"
      text: "understands Common but cannot speak"
    - label: "Challenge"
      text: "1 (200 XP)"

